<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B1C"/>
      <stop offset="0.45" stop-color="#0B1230"/>
      <stop offset="1" stop-color="#120A2B"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="360" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D6FF">
        <animate attributeName="stop-color" values="#55D6FF;#7C5CFF;#C15CFF;#55D6FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#7C5CFF">
        <animate attributeName="stop-color" values="#7C5CFF;#C15CFF;#55D6FF;#7C5CFF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#C15CFF">
        <animate attributeName="stop-color" values="#C15CFF;#55D6FF;#7C5CFF;#C15CFF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="200" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5BD8FF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#5BD8FF"/>
      <stop offset="0.55" stop-color="#7C5CFF"/>
      <stop offset="0.75" stop-color="#C15CFF"/>
      <stop offset="1" stop-color="#C15CFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blobBlue">
      <stop stop-color="#4CC9FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4CC9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPurple">
      <stop stop-color="#8A5CFF" stop-opacity=".52"/>
      <stop offset="1" stop-color="#8A5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink">
      <stop stop-color="#C15CFF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#C15CFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur28" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7C8DB5" stroke-opacity=".10" stroke-width="1"/>
    </pattern>

    <clipPath id="round">
      <rect x="1" y="1" width="1198" height="358" rx="24"/>
    </clipPath>

    <style>
      .small {
        font-family: "Segoe UI", Inter, Arial, sans-serif;
        letter-spacing: 5px;
      }
      .title {
        font-family: "Segoe UI", Inter, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .mono {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
      .particle {
        filter: url(#glow);
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <!-- Animated ambient blobs -->
    <circle cx="180" cy="80" r="180" fill="url(#blobBlue)" filter="url(#blur28)">
      <animate attributeName="cx" values="150;310;150" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;145;70" dur="10s" repeatCount="indefinite"/>
    </circle>

    <circle cx="980" cy="235" r="210" fill="url(#blobPurple)" filter="url(#blur28)">
      <animate attributeName="cx" values="980;860;980" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="240;155;240" dur="11s" repeatCount="indefinite"/>
    </circle>

    <circle cx="610" cy="395" r="180" fill="url(#blobPink)" filter="url(#blur28)">
      <animate attributeName="cx" values="560;700;560" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbit lines -->
    <ellipse cx="600" cy="185" rx="470" ry="145" stroke="#6F8EFF" stroke-opacity=".12" stroke-width="1.2" transform="rotate(-6 600 185)"/>
    <ellipse cx="600" cy="185" rx="400" ry="118" stroke="#A968FF" stroke-opacity=".10" stroke-width="1" transform="rotate(8 600 185)"/>

    <!-- Moving orbit nodes -->
    <circle r="3.5" fill="#64D8FF" class="particle">
      <animateMotion dur="9s" repeatCount="indefinite"
        path="M130,185 C210,35 990,35 1070,185 C990,335 210,335 130,185 Z"/>
    </circle>
    <circle r="3" fill="#B56CFF" class="particle">
      <animateMotion dur="12s" begin="-4s" repeatCount="indefinite"
        path="M200,190 C300,80 900,70 1000,190 C900,300 300,300 200,190 Z"/>
    </circle>

    <!-- Floating particles -->
    <g opacity=".9">
      <circle cx="105" cy="260" r="2" fill="#59D8FF" class="particle">
        <animate attributeName="cy" values="265;230;265" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;1;.2" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="265" cy="102" r="1.8" fill="#8B78FF" class="particle">
        <animate attributeName="cy" values="106;82;106" dur="5.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".25;1;.25" dur="5.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="938" cy="78" r="2.2" fill="#C372FF" class="particle">
        <animate attributeName="cy" values="84;56;84" dur="4.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".3;1;.3" dur="4.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1090" cy="275" r="1.9" fill="#65CCFF" class="particle">
        <animate attributeName="cy" values="282;248;282" dur="5.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;1;.2" dur="5.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="308" r="1.6" fill="#9A6DFF" class="particle">
        <animate attributeName="cy" values="312;292;312" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;.85;.2" dur="4.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Top terminal decoration -->
    <g transform="translate(54 42)">
      <circle cx="0" cy="0" r="4" fill="#63D5FF"/>
      <circle cx="15" cy="0" r="4" fill="#8F72FF"/>
      <circle cx="30" cy="0" r="4" fill="#C06BFF"/>
      <text x="52" y="4" fill="#9FAECC" fill-opacity=".68" font-size="12" class="mono">~/github/profile</text>
    </g>

    <!-- Main text -->
    <text x="600" y="122" text-anchor="middle" fill="#9FB4D8" font-size="15" class="small">
      WELCOME TO MY DIGITAL SPACE
    </text>

    <text x="600" y="190" text-anchor="middle" fill="url(#titleGrad)" font-size="58" class="title" filter="url(#glow)">
      HELLO, I'M A DEVELOPER
    </text>

    <text x="600" y="235" text-anchor="middle" fill="#C9D3EA" fill-opacity=".86" font-size="17" class="mono">
      &lt; <tspan fill="#6BD7FF">CODE</tspan>
      <tspan fill="#71809D"> • </tspan>
      <tspan fill="#9C7BFF">BUILD</tspan>
      <tspan fill="#71809D"> • </tspan>
      <tspan fill="#C479FF">EXPLORE</tspan> /&gt;
    </text>

    <!-- Animated underline -->
    <rect x="280" y="267" width="640" height="2" rx="1" fill="url(#lineGrad)">
      <animate attributeName="width" values="0;640;640;0" keyTimes="0;0.35;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="600;280;280;600" keyTimes="0;0.35;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Bottom status -->
    <g transform="translate(600 313)">
      <circle cx="-120" cy="-4" r="5" fill="#6DE7C2" filter="url(#glow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="-105" y="0" fill="#AAB9D5" font-size="13" class="mono">status: building something cool</text>

      <rect x="112" y="-11" width="2" height="15" rx="1" fill="#73D6FF">
        <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Subtle moving scan light -->
    <rect x="-250" y="0" width="180" height="360" fill="white" opacity=".025" transform="skewX(-18)">
      <animate attributeName="x" values="-300;1350" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="24" stroke="#7B75FF" stroke-opacity=".25" stroke-width="2"/>
</svg>
